apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-api
  namespace: k8s-demo
  labels:
    app: k8s-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-demo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: k8s-demo-api
    spec:
      containers:
        - name: k8s-demo-api
          image: k8s-demo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: k8s-demo-config
            - secretRef:
                name: k8s-demo-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
