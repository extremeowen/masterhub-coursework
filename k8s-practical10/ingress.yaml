apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-demo
  namespace: masterhub-p10
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-demo.local
      http:
        paths:
          - path: /debug
            pathType: Prefix
            backend:
              service:
                name: debug-service
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: k8s-demo
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: k8s-demo
                port:
                  name: http
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: k8s-demo
                port:
                  name: http
