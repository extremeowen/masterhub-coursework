apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: masterhub-p10
  labels:
    app.kubernetes.io/name: debug-pod
    app.kubernetes.io/part-of: masterhub-practical10
spec:
  containers:
    - name: nginx-debug
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: debug-service
  namespace: masterhub-p10
  labels:
    app.kubernetes.io/name: debug-pod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: debug-pod
  ports:
    - name: http
      port: 80
      targetPort: http
