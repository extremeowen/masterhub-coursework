services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      RATE_LIMIT: 1000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting Docker Compose}
      MASTERHUB_ADMIN_EMAIL: ${MASTERHUB_ADMIN_EMAIL:?Set MASTERHUB_ADMIN_EMAIL before starting Docker Compose}
      MASTERHUB_ADMIN_PASSWORD: ${MASTERHUB_ADMIN_PASSWORD:?Set MASTERHUB_ADMIN_PASSWORD before starting Docker Compose}
      MASTERHUB_USER_EMAIL: ${MASTERHUB_USER_EMAIL:-}
      MASTERHUB_USER_PASSWORD: ${MASTERHUB_USER_PASSWORD:-}
      DATABASE_URL: postgresql://masterhub:masterhub@db:5432/masterhub
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: masterhub-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OBSERVABILITY_LOG_FILE: /var/log/masterhub/app.log
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8081:8080"
      - "9465:9465"
    volumes:
      - masterhub-logs:/var/log/masterhub

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "3001:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masterhub
      POSTGRES_USER: masterhub
      POSTGRES_PASSWORD: masterhub
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterhub -d masterhub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "4319:4319"
      - "9464:9464"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/config.yaml:ro
      - masterhub-logs:/var/log/masterhub:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres-data:
  masterhub-logs:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
