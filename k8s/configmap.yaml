apiVersion: v1
kind: ConfigMap
metadata:
  name: masterhub-config
  namespace: masterhub
data:
  NODE_ENV: production
  PORT: "8080"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: masterhub-api
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/metrics
  PROMETHEUS_PORT: "9465"
  OBSERVABILITY_LOG_FILE: /var/log/masterhub/app.log
