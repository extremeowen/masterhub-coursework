apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterhub-api
  namespace: masterhub
  labels:
    app.kubernetes.io/name: masterhub-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: masterhub-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterhub-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9465"
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: observability-logs
          emptyDir: {}
      containers:
        - name: api
          image: masterhub-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9465
          envFrom:
            - configMapRef:
                name: masterhub-config
            - secretRef:
                name: masterhub-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: observability-logs
              mountPath: /var/log/masterhub
---
apiVersion: v1
kind: Service
metadata:
  name: masterhub-api
  namespace: masterhub
  labels:
    app.kubernetes.io/name: masterhub-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: masterhub-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9465
      targetPort: metrics
