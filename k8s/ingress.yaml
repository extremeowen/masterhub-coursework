apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masterhub
  namespace: masterhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: masterhub.local
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: masterhub-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: masterhub-api
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: masterhub-api
                port:
                  name: http
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: masterhub-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: masterhub-frontend
                port:
                  name: http
