apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterhub-frontend
  namespace: masterhub
  labels:
    app.kubernetes.io/name: masterhub-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: masterhub-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masterhub-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: masterhub-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: masterhub-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: masterhub-frontend
  namespace: masterhub
  labels:
    app.kubernetes.io/name: masterhub-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: masterhub-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
